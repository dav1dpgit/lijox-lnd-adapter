# WireGuard — the RENTED SERVER side (template; vps-setup.sh fills the keys).
# The tunnel only. What reaches the home node through it is decided by HAProxy (haproxy.cfg): :443 and :9735 as
# blind TCP relays. No NAT, no IP forwarding: the server itself connects to the node over the tunnel, so the node's
# replies come back the same way without any rule.
[Interface]
Address = 10.9.0.1/24
ListenPort = 51820
PrivateKey = <VPS_PRIVATE_KEY>

[Peer]
# the home node
PublicKey = <NODE_PUBLIC_KEY>
AllowedIPs = 10.9.0.2/32

# The earlier, Lightning-only form (no HAProxy): forward port 9735 with NAT instead —
#   PostUp   = sysctl -w net.ipv4.ip_forward=1; iptables -t nat -A PREROUTING -i <PUBLIC_IFACE> -p tcp --dport 9735 -j DNAT --to-destination 10.9.0.2:9735; iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
#   PostDown = iptables -t nat -D PREROUTING -i <PUBLIC_IFACE> -p tcp --dport 9735 -j DNAT --to-destination 10.9.0.2:9735; iptables -t nat -D POSTROUTING -o wg0 -j MASQUERADE
