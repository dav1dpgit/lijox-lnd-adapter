# haproxy.cfg — the RENTED SERVER (template). Drop in at /etc/haproxy/haproxy.cfg after a dated backup of the
# distribution's file, then `haproxy -c -f /etc/haproxy/haproxy.cfg` and `systemctl restart haproxy`.
#
# Two blind TCP relays over the WireGuard tunnel to the home node (10.9.0.2):
#   :443  → the node's Caddy, with PROXY protocol v2 so the node still sees each client's real address
#           (TLS is NOT ended here: this server sees ciphertext and the SNI name, nothing else)
#   :9735 → the node's Lightning port, plain (Lightning peers carry their own encryption; LND does not read PROXY)
# No access logging (nothing about who connected is kept on the rented server); errors only.
global
    log /dev/log local0 err
    maxconn 4000
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option dontlognull
    option dontlog-normal
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    retries 2

frontend https_in
    bind :443
    default_backend node_https

backend node_https
    server node 10.9.0.2:443 send-proxy-v2 check inter 10s

frontend lightning_in
    bind :9735
    default_backend node_lightning

backend node_lightning
    server node 10.9.0.2:9735 check inter 10s

# Several nodes behind one server (later): route :443 by the TLS name instead of a default backend —
#   frontend https_in
#       bind :443
#       tcp-request inspect-delay 5s
#       tcp-request content accept if { req_ssl_hello_type 1 }
#       use_backend node_https   if { req_ssl_sni -i -m end .example-one.net }
#       use_backend node2_https  if { req_ssl_sni -i -m end .example-two.net }
# and a second Lightning port (:9736 → 10.9.0.3:9735) for the second node.
